name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./... 2>&1 | tee evidence/test-race.log
      - name: compat + legacy fixtures
        run: go test -run 'TestRustFixtures|TestLegacy|TestVersionTags' -v ./internal/ekb
      - name: bidirectional Rust round-trip (Go writes, Rust reads)
        run: |
          set -o pipefail
          sh scripts/roundtrip.sh 2>&1 | tee evidence/roundtrip.log
      - name: cross-filesystem determinism
        run: sh scripts/cross-fs.sh
      - name: benchmarks (short, median-of-runs)
        run: |
          set -o pipefail
          runs=$(go run ./internal/tools/benchagg -print-runs)
          go test -run '^$' -bench . -benchmem -benchtime 100ms -count="$runs" ./internal/ekb | go run ./internal/tools/benchagg | tee evidence/bench-ci.txt
      - name: performance history (append)
        run: sh scripts/bench-history.sh
      - name: 2 GiB bounded-memory stream
        run: EKB_RUN_SCALE=1 go test -run TestStreamBoundedMemory2GiB -v ./internal/ekb
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/

  fuzz:
    # Native Go fuzzing, OOM-capped: every target runs inside scripts/sandbox.sh
    # (--memory=2g --memory-swap=2g --cpus=2 --pids-limit=512, GOMAXPROCS=2), so a
    # runaway fuzzer is killed in the container and cannot take down the runner —
    # no `go` runs on the host. Short budget per target on every push; the corpus
    # and per-target logs are published to evidence/fuzz/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuzz (60s per target, sandboxed)
        run: FUZZTIME=60s sh scripts/fuzz.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz
          path: |
            evidence/fuzz.json
            evidence/fuzz/

  soak:
    # Long-running randomized round-trip soak: proves the implementation keeps
    # processing billions of logical symbols with bounded memory inside the
    # sandbox's 2 GiB cap. Short budget here; evidence/soak.json records the peak.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: randomized round-trip soak (bounded memory)
        run: SOAK_SECONDS=60 sh scripts/soak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: soak
          path: evidence/soak.json

  endurance:
    # Long-run writer endurance / fault-injection: append a generation, damage it
    # (truncate mid-write / mid-manifest / torn footer, bit flips in body / header /
    # manifest / footer, damage to an older generation, header-or-core truncation),
    # assert Open returns exactly the newest surviving valid generation or a typed
    # error, repair with TruncateToValid and continue — plus a concurrent-reader
    # phase. Runs inside the capped sandbox (scripts/sandbox.sh); the harness writes
    # evidence/endurance.json and evidence/endurance.log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fault-injection endurance (append/damage/repair + concurrent readers)
        run: sh scripts/endurance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: endurance
          path: |
            evidence/endurance.json
            evidence/endurance.log

  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: skewed small-record court
        working-directory: courts
        run: go run .
      - name: 4 KiB point-read court (Pebble)
        working-directory: courts
        run: go run ./point
      - name: YCSB value-log court
        working-directory: courts
        run: go run ./ycsb
      - name: performance history (append)
        working-directory: .
        run: sh scripts/bench-history.sh

  arm64:
    # Cross-architecture runtime determinism under qemu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: docker/setup-qemu-action@v3
      - name: arm64 suite + fingerprints
        run: sh scripts/container-aarch64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-determinism
          path: evidence/aarch64-determinism.json

  arm64-native:
    # Native arm64 (real hardware, no qemu): full suite, benchmarks, and a
    # fingerprint that must equal the recorded amd64 fingerprint.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: suite (native arm64)
        run: go test ./...
      - name: native benchmarks (median-of-runs)
        run: |
          set -o pipefail
          runs=$(go run ./internal/tools/benchagg -print-runs)
          go test -run '^$' -bench . -benchmem -benchtime 100ms -count="$runs" ./internal/ekb | go run ./internal/tools/benchagg | tee evidence/aarch64-native-bench.txt
      - name: native fingerprint must equal the recorded amd64 fingerprint
        run: |
          set -o pipefail
          go run ./internal/tools/fingerprint testdata | tee evidence/aarch64-native-fingerprint.txt
          want=$(grep -o '"amd64_fingerprint_sha256": "[0-9a-f]*"' evidence/aarch64-determinism.json | grep -o '[0-9a-f]\{64\}')
          got=$(sha256sum evidence/aarch64-native-fingerprint.txt | cut -d' ' -f1)
          echo "recorded amd64 fingerprint: $want"
          echo "native   arm64 fingerprint: $got"
          test "$want" = "$got"
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-native
          path: |
            evidence/aarch64-native-bench.txt
            evidence/aarch64-native-fingerprint.txt

  fsmatrix:
    # Full cross-filesystem matrix. The runner's passwordless sudo lets the
    # script create loopback ext4/xfs/btrfs images, so xfs is actually exercised
    # (which a rootless host cannot do), alongside the repository's real ext4 and
    # /dev/shm tmpfs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: install filesystem tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xfsprogs btrfs-progs
      - name: cross-filesystem matrix (ext4/xfs/btrfs/tmpfs)
        run: sh scripts/cross-fs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cross-fs
          path: evidence/cross-fs.json

  wasm:
    # WebAssembly: build wasip1 + js/wasm, then prove the WASI fingerprint equals
    # the recorded amd64/arm64 one (amd64 == arm64 == wasip1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: install wasmtime
        run: curl -sSfL https://wasmtime.dev/install.sh | bash
      - name: wasm build + WASI fingerprint
        run: |
          export PATH="$HOME/.wasmtime/bin:$PATH"
          sh scripts/wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasip1
          path: evidence/wasip1-fingerprint.txt

  rocksdb:
    # RocksDB value-codec integration. Built and run inside a container capped at
    # --memory=2g --memory-swap=2g --cpus=2 --pids-limit=512 by scripts/rocksdb.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RocksDB value codec (Put/Get + MergeOperator)
        run: sh scripts/rocksdb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdb-blobdb
          path: evidence/rocksdb-blobdb.json

  parquet:
    # Parquet dictionary-page court vs the machine-9 shared dictionary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parquet dictionary court
        run: sh scripts/parquet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: parquet-dict
          path: evidence/parquet-dict.json

  pebble:
    # Pebble value-log case study: machine-9 cores as Pebble values, zero-alloc decode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pebble value-log case study
        run: sh scripts/pebble.sh
      - name: Pebble integration depth (scan / ingest / compaction / cache pressure)
        run: sh scripts/pebble-integration.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pebble-vlog
          path: |
            evidence/pebble-vlog.json
            evidence/pebble-integration.json

  prometheus:
    # Prometheus exporter + Grafana dashboard (one scrape captured).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus exporter scrape + dashboard
        run: sh scripts/prometheus.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus
          path: |
            evidence/prometheus-scrape.txt
            evidence/grafana-dashboard.json

  conformance:
    # The implementation-neutral conformance suite: immutable, versioned golden
    # fixtures verified independently by the Go and Rust implementations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: stage the Rust reference
        run: sh scripts/setup-reference.sh
      - name: conformance suite (Go + Rust verifiers)
        run: sh scripts/conformance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: evidence/conformance.json
