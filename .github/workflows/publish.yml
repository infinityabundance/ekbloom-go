name: publish

# Build and push the minimal runtime image, multi-arch (linux/amd64 + arm64), to
# Docker Hub and GHCR. Docker Hub publishing is skipped automatically when its
# credentials are absent, so the workflow is green on a fork without secrets.
#
# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.probe.outputs.dockerhub }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.check.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (GHCR runtime)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push (GHCR runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}

      # The `test` image carries the full source + Go toolchain so a third party
      # can reproduce the suite without cloning:
      #   docker run --rm ghcr.io/infinityabundance/ekbloom-go:test
      - name: Metadata (GHCR test)
        id: meta-ghcr-test
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=test
            type=semver,pattern={{version}}-test

      - name: Build and push (GHCR test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr-test.outputs.tags }}
          labels: ${{ steps.meta-ghcr-test.outputs.labels }}

      - name: Metadata (Docker Hub runtime)
        id: meta-hub
        if: needs.check.outputs.dockerhub == 'true'
        uses: docker/metadata-action@v5
        with:
          images: infinityabundance/ekbloom-go
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Reuses the build cache from the GHCR push; only the tags/labels differ.
      - name: Build and push (Docker Hub runtime)
        if: needs.check.outputs.dockerhub == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}

      - name: Metadata (Docker Hub test)
        id: meta-hub-test
        if: needs.check.outputs.dockerhub == 'true'
        uses: docker/metadata-action@v5
        with:
          images: infinityabundance/ekbloom-go
          tags: |
            type=raw,value=test
            type=semver,pattern={{version}}-test

      - name: Build and push (Docker Hub test)
        if: needs.check.outputs.dockerhub == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-hub-test.outputs.tags }}
          labels: ${{ steps.meta-hub-test.outputs.labels }}
